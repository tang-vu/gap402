name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arc Foundry
        run: |
          asset=arc-foundry-v0.8.0-1-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/circlefin/arc-foundry/releases/download/v0.8.0-1
          curl -sSfL "$base/$asset" -o "/tmp/$asset"
          curl -sSfL "$base/$asset.sha256" -o "/tmp/$asset.sha256"
          (cd /tmp && sha256sum -c "$asset.sha256")
          tar -xzf "/tmp/$asset" -C /tmp
          mkdir -p "$HOME/.local/bin"
          for b in forge cast anvil; do
            mv "/tmp/$b" "$HOME/.local/bin/arc-$b"
            chmod +x "$HOME/.local/bin/arc-$b"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Contract tests
        working-directory: contracts
        run: arc-forge test --network arc -vv
